<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物管理 · 设置</title><link rel="stylesheet" href="/style.css"></head>
<body><section id="login" class="login"><div class="mark">鱼</div><p class="eyebrow">XIAOYU / LOCAL</p><h1>人物管理中台</h1><p>管理每个人物的 QQ、人格和运行状态。</p><form id="login-form"><label for="password">本机管理密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">进入设置</button></form><p class="hint">首次登录的密码保存在项目目录<br><code>data/settings/login.txt</code></p></section>
<div id="workspace" hidden><aside><div class="brand"><span class="mark small">鱼</span><div><strong>人物管理</strong><small id="settings-target">原有主实例设置</small></div></div><nav id="nav" aria-label="设置分类"></nav><div class="aside-foot">本机管理 · 独立人物<button id="logout" class="quiet">退出登录</button></div></aside>
<main><header><div><p class="eyebrow">WORKSPACE SETTINGS</p><h1 id="heading">概览</h1><p id="description">看看她现在的状态，再决定要调整什么。</p></div><span id="connection" class="pill">读取中</span></header>
<div id="status-cards" class="status-cards"></div><div class="toolbar"><label class="search-label" for="search">查找设置</label><input id="search" type="search" placeholder="搜索名称或配置项…"><button id="reload" class="secondary">重新载入</button></div>
<section id="content"></section><footer id="save-bar"><div><strong id="dirty-count">没有未保存修改</strong><small id="save-note">保存后显示待生效，重启完成后核对实际配置。</small></div><button id="save" disabled>保存修改</button><button id="restart" class="secondary">重启并生效</button></footer></main></div>
<div id="notice" role="status" aria-live="polite" hidden></div><script src="/characters.js"></script><script src="/app.js"></script></body></html>
