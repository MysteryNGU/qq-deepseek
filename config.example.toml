# DSH sole-role configuration. Set owner and API credentials before starting.
# Native tools share action_per_hour/day; 0 means unlimited.
name = "大肥鱼"
persona = "persona.md"
# Set true to use the same persona file in owner/private/group contexts.
unified_persona = true
same_person_group_recall = true
profile_review_enabled = true
public_persona = "personas/public.md"
ws_url = "ws://127.0.0.1:3001"
ws_token = ""
api_key = ""
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
owner = 0
friends = []
known_people = {  }
allow_groups = []
acknowledge_before_work = true # 接到请求后，先确认应答已送达，再开始外部工具工作。
allow_all_private = false
life_db = "data/life.db"
life_agent = "default"
continuity_enabled = false
# Set after doctor and the consultation integration checks pass.
consult_config = ""
# Optional policy overrides; ordinary packages can supply installed identity/policy metadata.
capability_policies = []
life_dynamics = {  }
dsh_root = "vendor/dsh-bridge-work"
dsh_home = "../dsh-qq-home"
dsh_node = "D:/projects/tools/node-v22.19.0-win-x64/node.exe"
dsh_provider = "deepseek-official"
dsh_timeout = 180
dsh_tmp = "D:/projects/tools/tmp"
dsh_pnpm_entry = ""
# bili_plugin defaults to the current user's .dsh/plugins/dsh-bili-subagent.
public_tools = []
action_per_hour = 500
action_per_day = 0
handoff_seconds = 10
# Chat waits 2-5 seconds; long/structured text is pasted whole after 4 seconds.
typing_chars_per_second = 3
paste_threshold = 300
# Optional: this machine's QQ media cache roots, as returned by get_image.
# Replace account-specific paths when moving to another computer.
media_local_roots = []
media_max_mb = 64
asr_model = "small"
asr_language = "zh"
# Enable after installing at least one explicitly declared provider.
[local_media]
enabled = false
root = "data/local-media"
# Optional owner-private reference/sample manifest; imported with verified digests.
preset_manifest = ""
timeout_seconds = 600
min_available_ram_mib = 1024
min_free_vram_mib = 4096
max_pending_jobs = 8
# Keep a loaded speech model for follow-up replies; unload before image jobs.
speech_idle_seconds = 300
# The sole backend registry; backend-specific settings belong in each provider.config.
providers = []
defaults = {}
# Example: remove providers/defaults above and fill the installed paths and version.
# [local_media.defaults]
# image = "qwen-sdcpp"
# [[local_media.providers]]
# provider_id = "qwen-sdcpp"
# module = "life.media_adapters.qwen_sdcpp"
# adapter_version = "1"
# model_version = "your-installed-model-revision"
# [local_media.providers.environment]
# python = ".venv/Scripts/python.exe"
# [local_media.providers.config]
# image_server = "D:/your-engine/sd-server.exe"
# image_model_dir = "D:/your-models/qwen"
# image_max_vram_gib = 5.0
# worker_threads = 4

[resource_policy]
# Idle polls draw once after the action sequence ends; real inputs stay immediate.
idle_min_seconds = 600
idle_random_max_seconds = 3600
# Owner private chat: opportunities to act, not mandatory messages.
owner_idle_min_seconds = 900
owner_idle_max_seconds = 1800
# Legacy settings retained for older configurations and non-idle cooldowns.
idle_base_seconds = 900
idle_max_seconds = 7200
unchanged_per_tier = 2
text_preview_target_tokens = 3000
text_result_max_tokens = 4000
text_result_max_utf8_bytes = 24000
dynamic_context_target_tokens = 6000
memory_context_target_tokens = 2400
continuity_context_target_tokens = 800
  # Complete-request soft targets; mandatory inputs may exceed them.
  chat_input_target_tokens = 32000
  task_input_target_tokens = 48000
  pressure_ratio = 0.80
  recent_history_target_tokens = 8000
  handoff_target_tokens = 4000
  profiles_target_tokens = 800
  provider_margin_tokens = 1024
  reference_image_batches = 2
  # Legacy percentage used only by workers without context-efficiency protocol.
  compaction_threshold_percent = 80
compaction_retain_tokens = 16384
compaction_headroom_tokens = 8192
compaction_summary_tokens = 4096
autonomous_no_progress_limit = 3

# Covers Bot-owned DSH model streams, not other applications or plugin-direct APIs.
[spending_policy]
enabled = false
daily_target_fen = 500
daily_limit_fen = 1000

# Rebuildable indexes over life.db, without a second chat archive.
[memory_index]
chunk_tokens = 384
overlap_tokens = 48
route_limit = 40
scan_limit = 10000
rrf_k = 60
related_hops = 2
retire_after_hours = 24

# Historical person review is separate from hourly summarization.
[profile_backfill]
enabled = false
batch_events = 8
interval_seconds = 60
timeout_seconds = 300

# Ordinary continuous tasks; each next step starts after the prior turn settles.
[activity]
enabled = true
step_delay_seconds = 5
no_progress_limit = 3
self_step_limit = 8

[media_library]
max_active_per_scope = 50
lifetime_days = 30

# Same-role background sessions require DSH memory_protocol = 1.
[memory_organize]
enabled = true
ordinary_sharing_enabled = true
interval_seconds = 3600
batch_events = 80
lease_seconds = 120
max_source_pages = 64
timeout_seconds = 900

# Opt in only after verifying this endpoint/model on the same synthetic corpus.
# No DeepSeek chat endpoint or model is implicitly treated as an embedding API.
[embedding]
enabled = false
endpoint = ""
model_id = ""
model_revision = ""
provider_revision = ""
dimension = 0
api_key_env = ""
allow_external_text = false
price_version = ""
# To enable, supply the verified integer price in nano-CNY per input token.
# input_nano_per_token = 0  # Only for a verified free/local endpoint.
max_input_tokens = 8192
max_request_bytes = 262144
timeout_seconds = 30

# Optional owned CPU service; weights must be downloaded and verified first.
# It only listens on 127.0.0.1 and starts/stops with the Bot.
[local_embedding]
enabled = false
model_path = "data/models/bge-small-zh-v1.5"
manifest_digest = ""
host = "127.0.0.1"
port = 8231
threads = 2

# ADD-08: numerical adult_intimate state. This does not enter a scene or start
# continuous input. The current user must explicitly confirm context and mode.
[experience]
simulation_enabled = true
private_enabled = true
# Protocol 2: peak permission is always single-use; stop resets the whole episode.
sensitivity_gain = 0.06
threshold_gain = 0.015
round_interval_k = 0.9
permission_timeout = 90.0
settle_tau_min = 60.0
settle_tau_max = 120.0
self_init_threshold = 0.65
relief_amount = 0.25
relief_half_life = 1800.0
rate_gain_per_run = 0.05
rate_gain_cap = 1.0
# Persistent sensitivity gain per completed private run; effective sensitivity <= 1.5.
private_sensitivity_gain_per_run = 0.02
private_sensitivity_gain_cap = 0.5
expression_policy = "existing_chat"
threshold = 0.55
release_threshold = 0.35
min_hold_seconds = 0.0
peak_keep_ratio = 0.4
recovery_seconds = 120.0
arousal_half_life_seconds = 1800.0
satiety_half_life_seconds = 600.0
valence_half_life_seconds = 900.0
adaptation_seconds = 300.0
adaptation_recovery_seconds = 600.0
load_recovery_seconds = 900.0
engagement_seconds = 180.0
input_rate_per_second = 0.003
load_rate_per_second = 0.0002
sensitivity_min = 0.25
sensitivity_max = 1.5
